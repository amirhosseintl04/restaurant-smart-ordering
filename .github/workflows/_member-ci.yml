# Reusable pipeline for one uv workspace member (SAD 12.5 steps 1-3, ADR-12, ADR-14).
# Called by the thin per-member workflows, which own the path filters (SAD 12.5: "a pipeline
# runs only when that service's folder changes") and the concurrency group.
# Steps 4-6 of SAD 12.5 (image build, compose integration tests, deploy) are not here yet.
name: member-ci

on:
  workflow_call:
    inputs:
      member-path:
        description: "Member folder relative to the repository root, e.g. services/order"
        required: true
        type: string
      package:
        description: "Distribution name of the member, e.g. order-service"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ${{ inputs.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MEMBER_PATH: ${{ inputs.member-path }}
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"

      - name: Install Python from .python-version
        run: uv python install

      - name: Sync isolated environment (member, its dependencies, locked dev tools)
        id: sync
        run: bash .github/scripts/sync-member.sh "$PACKAGE"

      - name: Ruff format check
        run: uv run --no-sync ruff format --check "$MEMBER_PATH"

      # Lint and tests run even if the format check failed, so one failure does not hide the
      # others; they are skipped when the environment could not be built.
      - name: Ruff lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff check "$MEMBER_PATH"

      - name: Unit tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Exit code 5 means "no tests collected": acceptable for a member with no tests yet.
        run: |
          set +e
          uv run --no-sync pytest "$MEMBER_PATH"
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice::No tests collected in $MEMBER_PATH"
            exit 0
          fi
          exit "$code"
