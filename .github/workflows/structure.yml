# Structural checks of the repository itself (SAD 12.4, SAD 12.5, ADR-14): workspace layout,
# CI workflow shape and the compose file. These tests only read files from the checkout, so
# they run in the isolated platform-lib environment. A service change runs its own pipeline
# plus this light check; that overlap is accepted.
name: structure

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "adapters/**"
      - "libs/**"
      - ".github/**"
      - "deploy/**"
      - "gateway/kong.yml"
      - ".env.example"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
  pull_request:
    paths:
      - "services/**"
      - "adapters/**"
      - "libs/**"
      - ".github/**"
      - "deploy/**"
      - "gateway/kong.yml"
      - ".env.example"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: structural tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"

      - name: Install Python from .python-version
        run: uv python install

      - name: Sync isolated environment (platform-lib and locked dev tools)
        run: bash .github/scripts/sync-member.sh platform-lib

      - name: Structural tests
        run: |
          tests=()
          for file in \
            libs/platform/tests/test_workspace_layout.py \
            libs/platform/tests/test_ci_workflows.py \
            libs/platform/tests/test_deploy_compose.py; do
            if [ -f "$file" ]; then
              tests+=("$file")
            else
              echo "::notice::$file does not exist yet; skipped"
            fi
          done
          uv run --no-sync pytest "${tests[@]}"
