# Contract validation (SAD 7.4 rule 3, SAD 11.1, SAD 12.5 step 3): event JSON Schemas
# (draft 2020-12), event examples against their schemas, and OpenAPI 3.1 documents.
name: contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/scripts/validate-contracts.sh"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/scripts/validate-contracts.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"

      - name: Install Python from .python-version
        run: uv python install

      - name: Validate schemas, examples and OpenAPI documents
        run: bash .github/scripts/validate-contracts.sh contracts
