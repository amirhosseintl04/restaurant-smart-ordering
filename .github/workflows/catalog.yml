# CI for the catalog service: runs only when its inputs change (SAD 12.5).
name: catalog

on:
  push:
    branches: [main]
    paths:
      - "services/catalog/**"
      - "libs/platform/**"
      - "contracts/openapi/catalog.yaml"
      - "contracts/events/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/catalog.yml"
      - ".github/workflows/_member-ci.yml"
      - ".github/scripts/sync-member.sh"
  pull_request:
    paths:
      - "services/catalog/**"
      - "libs/platform/**"
      - "contracts/openapi/catalog.yaml"
      - "contracts/events/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/catalog.yml"
      - ".github/workflows/_member-ci.yml"
      - ".github/scripts/sync-member.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_member-ci.yml
    with:
      member-path: services/catalog
      package: catalog-service
