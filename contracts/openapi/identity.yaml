openapi: 3.1.0
info:
  title: Identity Service API
  version: 0.1.0
  summary: Login, JWT issuance, roles and member-customer profiles (SAD 4.2).
  description: |
    Contract of the Identity service for Iteration 1: the internal member-customer lookup used
    by Conversation (SAD 11.3) and the health checks (SAD 13.2). The public login and staff
    endpoints of SAD 11.2 are added in a later iteration.

    Conventions (SAD 11.1): JSON with `snake_case` fields, ISO-8601 UTC times, RFC 9457
    `application/problem+json` errors, `X-Correlation-Id` on every request and response.

    Tenancy (SAD 8.2): every `/internal` request carries `X-Tenant-Id`, propagated by the
    caller. A request without it is rejected with `400 tenant-required`. A customer is a member
    of one restaurant; only customers of that tenant are visible.

    `/internal/*` paths are reachable on the internal network only and are never routed by the
    gateway.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://identity-svc:8000
    description: Internal Docker network (SAD 12.2).
security: []
tags:
  - name: health
    description: Liveness and readiness probes (SAD 13.2).
  - name: internal
    description: Internal network only, not routed by the gateway (SAD 11.3).
paths:
  /health/live:
    get:
      tags: [health]
      operationId: health_live
      summary: Process is alive
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLive"
  /health/ready:
    get:
      tags: [health]
      operationId: health_ready
      summary: Database and broker are reachable
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
        "503":
          description: At least one dependency is unreachable. Same body shape as 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
  /internal/customers/by-channel:
    get:
      tags: [internal]
      operationId: get_customer_by_channel
      summary: Member-customer profile by channel identity (Conversation → Identity)
      description: |
        Called once per session (SAD 6.1). `404 not-found` is the normal answer for a guest:
        Conversation then continues without a `customer_id`.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: channel
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Channel"
          example: bale
        - name: external_user_id
          in: query
          required: true
          description: The customer's identity in the channel, e.g. the Bale user ID (SAD 2.4).
          schema:
            type: string
            minLength: 1
            maxLength: 128
          example: "98123456"
      responses:
        "200":
          description: The member customer.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
              example:
                customer_id: cus_9001
                channel: bale
                external_user_id: "98123456"
                display_name: علی
                registered_at: "2026-11-13T09:40:12Z"
        "400":
          $ref: "#/components/responses/TenantRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/UnexpectedError"
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant (restaurant) of the request, propagated by the internal caller (SAD 8.2).
      schema:
        $ref: "#/components/schemas/Id"
      example: rest_42
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Correlation ID, propagated by internal callers; generated by the service when absent (SAD 11.1, 13.2).
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: c-7d1e3a90
  headers:
    X-Correlation-Id:
      description: Correlation ID of the request (SAD 11.1).
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    TenantRequired:
      description: "`tenant-required`: the `X-Tenant-Id` header is missing or blank."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.example.com/problems/tenant-required
            title: Tenant required
            status: 400
            detail: The X-Tenant-Id header is missing.
            instance: /internal/customers/by-channel
            correlation_id: c-7d1e3a90
    NotFound:
      description: "`not-found`: no member customer with this channel identity in this tenant."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.example.com/problems/not-found
            title: Not found
            status: 404
            detail: No member customer for this channel identity.
            instance: /internal/customers/by-channel
            correlation_id: c-7d1e3a90
    ValidationError:
      description: "`validation-error`: a header or query parameter is missing or invalid."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.example.com/problems/validation-error
            title: Validation error
            status: 422
            detail: The request is not valid.
            instance: /internal/customers/by-channel
            correlation_id: c-7d1e3a90
            errors:
              - { pointer: query.channel, detail: Field required }
    UnexpectedError:
      description: "`internal-error` or any other problem."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      description: Opaque, URL-safe identifier. Callers never parse it.
    Channel:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,31}$"
      description: Channel name. An open value, not an enum (QA-M1).
    Customer:
      type: object
      description: Member-customer profile. Carries no phone number or address in this version.
      required: [customer_id, channel, external_user_id, display_name, registered_at]
      properties:
        customer_id:
          $ref: "#/components/schemas/Id"
        channel:
          $ref: "#/components/schemas/Channel"
        external_user_id:
          type: string
          minLength: 1
          maxLength: 128
        display_name:
          type: [string, "null"]
          maxLength: 100
          description: Name to address the customer by; null when unknown.
        registered_at:
          type: string
          format: date-time
    HealthLive:
      type: object
      required: [status]
      properties:
        status:
          const: ok
    HealthReady:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [database, broker]
          properties:
            database:
              type: string
              enum: [ok, failed]
            broker:
              type: string
              enum: [ok, failed]
    Problem:
      type: object
      description: RFC 9457 problem details (SAD 11.1, 11.5).
      required: [type, title, status, correlation_id]
      properties:
        type:
          type: string
          format: uri
          description: "`https://api.example.com/problems/<slug>`; the slug identifies the problem."
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        correlation_id:
          type: string
        errors:
          type: array
          description: Present on `validation-error`.
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer:
                type: string
                description: Location of the invalid value, e.g. `query.channel`.
              detail:
                type: string
